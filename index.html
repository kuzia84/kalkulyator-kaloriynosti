<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Калькулятор калорийности и БЖУ готового блюда с учётом уварки"
    />
    <meta name="theme-color" content="#2f7d4f" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Тема до запуска приложения, чтобы страница не мигала. Ключ — THEME_STORAGE_KEY.
      try {
        var t = localStorage.getItem('kk-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <title>Калькулятор калорийности блюда</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
